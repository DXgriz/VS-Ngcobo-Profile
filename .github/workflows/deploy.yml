name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

  # Also allows you to run it manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # =========================================================
  # BUILD WEBSITE
  # =========================================================

  build:

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # 1. Download repository
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # -------------------------------------------------------
      # 2. Install PDF/Image conversion tools
      # -------------------------------------------------------

      - name: Install certificate preview tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick


      # -------------------------------------------------------
      # 3. Create certificate preview directory
      # -------------------------------------------------------

      - name: Create certificate preview directory
        run: |
          mkdir -p images/certificates


      # -------------------------------------------------------
      # 4. Generate WebP previews
      # -------------------------------------------------------

      - name: Generate certificate previews
        shell: bash
        run: |

          echo "========================================"
          echo " Certificate Preview Generator"
          echo "========================================"
          echo ""

          shopt -s nullglob

          certificates=(certificates/*.pdf)

          if [ ${#certificates[@]} -eq 0 ]; then

            echo "No PDF certificates found."

          else

            for pdf in "${certificates[@]}"
            do

              filename=$(basename "$pdf")
              name="${filename%.*}"

              temp="images/certificates/${name}-temp.png"
              output="images/certificates/${name}.webp"

              echo "Processing:"
              echo "$filename"

              # Convert only the FIRST page of the PDF
              pdftoppm \
                -f 1 \
                -singlefile \
                -png \
                -r 140 \
                "$pdf" \
                "images/certificates/${name}-temp"

              # Convert PNG to optimized WebP
              convert \
                "$temp" \
                -resize "1200x1200>" \
                -quality 82 \
                "$output"

              # Remove temporary PNG
              rm "$temp"

              echo "Created:"
              echo "$output"
              echo ""

            done

          fi


      # -------------------------------------------------------
      # 5. Show generated previews in Action logs
      # -------------------------------------------------------

      - name: List certificate previews
        run: |
          echo "Generated certificate previews:"
          ls -lh images/certificates/ || true


      # -------------------------------------------------------
      # 6. Configure GitHub Pages
      # -------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # -------------------------------------------------------
      # 7. Package finished static website
      # -------------------------------------------------------

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'


  # =========================================================
  # DEPLOY WEBSITE
  # =========================================================

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4